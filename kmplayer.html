<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Browser KMPlayer</title>
<style>
:root {
  --bg: #0b0c0d;
  --text: #b3b9c1;
  --panel: rgba(22, 23, 28, 0.92);
  --border: rgba(58, 61, 69, 0.8);
  --accent: #a855f7;
  --accent-h: #dfa5ff;
  --muted: #555;
  --err: #ff6b6b;
  --warn: #ffd93d;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  background: var(--bg); color: var(--text);
  font: 13px Consolas, "Courier New", monospace;
  overflow: hidden; user-select: none; cursor: none;
}
body.active-cursor { cursor: default; }
#wrap { position: fixed; inset: 0; background: #000; }
video { width: 100%; height: 100%; object-fit: contain; display: block; background: #000; }
.chrome {
  position: fixed; left: 0; right: 0; z-index: 50;
  opacity: 0; pointer-events: none;
  transition: opacity .2s, transform .2s;
}
.chrome.visible { opacity: 1; pointer-events: auto; }
.controls {
  bottom: 0;
  background: linear-gradient(transparent, rgba(0,0,0,.75) 30%, var(--panel));
  border-top: 1px solid var(--border);
  padding: 10px 12px 12px;
  display: flex; gap: 8px; align-items: center;
  transform: translateY(8px);
}
.controls.visible { transform: translateY(0); }
.seek-wrap { flex: 1; min-width: 0; }
.seek {
  width: 100%; height: 5px;
  -webkit-appearance: none; appearance: none;
  background: #2d3035; border-radius: 3px; cursor: pointer; outline: none;
}
.seek::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px; height: 14px; background: var(--accent); border-radius: 50%; margin-top: -4.5px;
}
.seek::-moz-range-thumb {
  width: 14px; height: 14px; background: var(--accent); border: none; border-radius: 50%;
}
.actions { display: flex; gap: 3px; align-items: center; }
.btn {
  background: transparent; color: var(--text); border: 1px solid transparent;
  padding: 5px 9px; border-radius: 3px; cursor: pointer;
  font: bold 13px Consolas, monospace; min-width: 32px;
  transition: color .1s, border-color .1s, background .1s;
}
.btn:hover { color: var(--accent-h); border-color: rgba(168, 85, 247, .35); }
.btn:active { background: rgba(168, 85, 247, .12); }
.btn.muted { color: var(--muted); }
.hud {
  top: 12px; right: 12px;
  background: rgba(15, 15, 18, .9); color: #c5a3ff;
  border: 1px solid rgba(168, 85, 247, .55);
  border-radius: 3px; padding: 7px 12px; font-weight: bold; max-width: 360px;
  transform: translateY(-6px);
}
.hud.visible { transform: translateY(0); }
.hud.warn { color: var(--warn); }
.hud.err { color: var(--err); }
#file-input { display: none; }
@media (pointer: coarse) {
  .seek { height: 12px; }
  .seek::-webkit-slider-thumb { width: 20px; height: 20px; margin-top: -4px; }
  .btn { padding: 10px 12px; font-size: 15px; }
}
</style>
</head>
<body>
<div id="wrap">
  <video id="video" playsinline preload="metadata"></video>
</div>
<div class="chrome hud" id="hud">Drop videos or 📂 (multi-select for next eps)</div>
<div class="chrome controls" id="controls">
  <div class="seek-wrap">
    <input type="range" class="seek" id="seek" min="0" max="0" step="0.05" value="0">
  </div>
  <div class="actions">
    <button class="btn" id="play" title="Play / Pause">▶</button>
    <button class="btn" id="mute" title="Mute">🔊</button>
    <button class="btn" id="vdown" title="Vol -">−</button>
    <button class="btn" id="vup" title="Vol +">+</button>
    <button class="btn" id="open" title="Open">📂</button>
  </div>
</div>
<input type="file" id="file-input" accept="video/*,.mkv,.avi,.mov,.ts,.m2ts,.wmv" multiple>

<script>
(() => {
  const video = document.getElementById('video');
  const seek = document.getElementById('seek');
  const hud = document.getElementById('hud');
  const controls = document.getElementById('controls');
  const playBtn = document.getElementById('play');
  const muteBtn = document.getElementById('mute');
  const fileIn = document.getElementById('file-input');
  const wrap = document.getElementById('wrap');

  let objectUrl = null;
  let lastVol = 1;
  let seeking = false;
  let hideTimer = 0;
  let hudTimer = 0;
  let queue = [];

  const HIDE_MS = 2200;
  const collator = new Intl.Collator(undefined, { numeric: true, sensitivity: 'base' });

  const fmt = t => {
    if (!Number.isFinite(t)) return '0:00';
    const m = Math.floor(t / 60);
    return m + ':' + String(Math.floor(t % 60)).padStart(2, '0');
  };

  const showChrome = (force = false) => {
    document.body.classList.add('active-cursor');
    controls.classList.add('visible');
    if (force || hud.textContent) hud.classList.add('visible');
    clearTimeout(hideTimer);
    hideTimer = setTimeout(hideChrome, HIDE_MS);
  };

  const hideChrome = () => {
    if (controls.matches(':hover')) {
      hideTimer = setTimeout(hideChrome, HIDE_MS);
      return;
    }
    controls.classList.remove('visible');
    hud.classList.remove('visible');
    document.body.classList.remove('active-cursor');
  };

  for (const ev of ['mousemove', 'mousedown', 'touchstart', 'keydown']) {
    document.addEventListener(ev, () => showChrome(), { passive: true });
  }
  controls.addEventListener('mouseenter', () => {
    clearTimeout(hideTimer);
    controls.classList.add('visible');
    document.body.classList.add('active-cursor');
  });
  controls.addEventListener('mouseleave', () => {
    hideTimer = setTimeout(hideChrome, HIDE_MS);
  });

  const msg = (text, type = '', ms = 2800) => {
    clearTimeout(hudTimer);
    hud.textContent = text;
    hud.className = 'chrome hud visible' + (type ? ' ' + type : '');
    showChrome(true);
    if (ms > 0) hudTimer = setTimeout(() => hud.classList.remove('visible'), ms);
  };

  const setMuteUI = () => {
    const m = video.muted || video.volume === 0;
    muteBtn.textContent = m ? '🔇' : '🔊';
    muteBtn.classList.toggle('muted', m);
  };

  const unlock = async () => {
    video.muted = false;
    video.volume = lastVol || 1;
    setMuteUI();
  };

  const togglePlay = async () => {
    await unlock();
    try {
      if (video.paused || video.ended) {
        await video.play();
        playBtn.textContent = '⏸';
        msg('PLAY');
      } else {
        video.pause();
        playBtn.textContent = '▶';
        msg('PAUSE');
      }
    } catch {
      msg('Play blocked – click again', 'err', 3000);
    }
  };

  const toggleMute = () => {
    if (video.muted || video.volume === 0) {
      video.muted = false;
      video.volume = lastVol || 1;
      msg(`VOLUME ${Math.round(video.volume * 100)}%`);
    } else {
      lastVol = video.volume;
      video.muted = true;
      msg('MUTED');
    }
    setMuteUI();
  };

  const changeVol = d => {
    unlock();
    const v = Math.min(1, Math.max(0, +(video.volume + d).toFixed(2)));
    video.volume = v;
    lastVol = v;
    video.muted = v === 0;
    setMuteUI();
    msg(`VOLUME ${Math.round(v * 100)}%`);
  };

  // Scroll = volume (up = louder, down = quieter)
  document.addEventListener('wheel', e => {
    e.preventDefault();
    showChrome();
    const step = e.deltaY < 0 ? 0.05 : -0.05;
    changeVol(step);
  }, { passive: false });

  const revoke = () => {
    if (objectUrl) {
      URL.revokeObjectURL(objectUrl);
      objectUrl = null;
    }
  };

  const load = file => {
    revoke();
    objectUrl = URL.createObjectURL(file);
    video.src = objectUrl;
    video.load();
    unlock();
    msg('Loading…', 'warn', 0);

    video.addEventListener('loadedmetadata', async () => {
      seek.max = video.duration || 0;
      seek.value = 0;
      const name = file.name.length > 36 ? file.name.slice(0, 34) + '…' : file.name;
      const next = queue.length ? ` · next ${queue.length}` : '';
      msg(name + next, '', 4000);
      try {
        await video.play();
        playBtn.textContent = '⏸';
      } catch {
        playBtn.textContent = '▶';
        msg('Ready – press Play', '', 3000);
      }
    }, { once: true });
  };

  const openFiles = files => {
    const list = [...files]
      .filter(f => f.type.startsWith('video/') || /\.(mp4|mkv|avi|mov|webm|ts|m2ts|wmv|m4v|ogv)$/i.test(f.name))
      .sort((a, b) => collator.compare(a.name, b.name));

    if (!list.length) return msg('No videos', 'err', 2500);

    queue = list.slice(1, 4);
    load(list[0]);
  };

  const playNext = () => {
    if (!queue.length) {
      msg('ENDED', '', 2500);
      return;
    }
    load(queue.shift());
  };

  playBtn.onclick = togglePlay;
  muteBtn.onclick = toggleMute;
  document.getElementById('vdown').onclick = () => changeVol(-0.1);
  document.getElementById('vup').onclick = () => changeVol(0.1);
  document.getElementById('open').onclick = () => fileIn.click();
  fileIn.onchange = () => fileIn.files.length && openFiles(fileIn.files);

  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT') return;
    const k = e.key;
    if (k === ' ' || k === 'k') { e.preventDefault(); togglePlay(); }
    else if (k === 'm') { e.preventDefault(); toggleMute(); }
    else if (k === 'ArrowUp') { e.preventDefault(); changeVol(0.1); }
    else if (k === 'ArrowDown') { e.preventDefault(); changeVol(-0.1); }
    else if (k === 'ArrowRight') {
      e.preventDefault();
      if (Number.isFinite(video.duration))
        video.currentTime = Math.min(video.currentTime + 5, video.duration);
    } else if (k === 'ArrowLeft') {
      e.preventDefault();
      video.currentTime = Math.max(video.currentTime - 5, 0);
    } else if (k === 'n') {
      e.preventDefault();
      playNext();
    } else if (k === 'f') {
      e.preventDefault();
      document.fullscreenElement ? document.exitFullscreen() : wrap.requestFullscreen?.();
    }
  });

  seek.oninput = () => {
    seeking = true;
    showChrome();
    if (Number.isFinite(video.duration)) {
      video.currentTime = +seek.value;
      msg(`${fmt(video.currentTime)} / ${fmt(video.duration)}`);
    }
  };
  seek.onchange = () => { seeking = false; };

  wrap.ondragover = e => { e.preventDefault(); wrap.style.outline = '2px solid var(--accent)'; showChrome(); };
  wrap.ondragleave = () => { wrap.style.outline = ''; };
  wrap.ondrop = e => {
    e.preventDefault();
    wrap.style.outline = '';
    if (e.dataTransfer.files.length) openFiles(e.dataTransfer.files);
  };

  video.ontimeupdate = () => {
    if (!seeking && Number.isFinite(video.duration)) seek.value = video.currentTime;
  };
  video.onplay = () => { playBtn.textContent = '⏸'; };
  video.onpause = () => { playBtn.textContent = '▶'; };
  video.onended = playNext;
  video.onwaiting = () => msg('BUFFERING…', 'warn', 0);
  video.onplaying = () => msg(queue.length ? `PLAYING · next ${queue.length}` : 'PLAYING');
  video.onvolumechange = () => { if (!video.muted) lastVol = video.volume; setMuteUI(); };
  video.onerror = () => {
    const map = { 1: 'ABORTED', 2: 'NETWORK', 3: 'DECODE', 4: 'UNSUPPORTED' };
    msg(map[video.error?.code] || 'ERROR', 'err', 4000);
    if (queue.length) setTimeout(playNext, 600);
    else revoke();
  };

  window.onbeforeunload = revoke;

  msg('Drop videos or 📂 (multi-select for next eps)', '', 0);
  showChrome(true);
  setTimeout(hideChrome, 3000);
})();
</script>
</body>
</html>
